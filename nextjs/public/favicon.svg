<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background circle -->
  <circle cx="50" cy="50" r="48" fill="url(#grad1)" opacity="0.2"/>
  
  <!-- Main shield/security icon -->
  <path d="M 50 15 L 30 25 L 30 45 Q 30 65 50 75 Q 70 65 70 45 L 70 25 Z" 
        fill="url(#grad1)" 
        stroke="#ffffff" 
        stroke-width="2"
        filter="url(#glow)"/>
  
  <!-- R2S text inside -->
  <text x="50" y="52" 
        font-family="Arial, sans-serif" 
        font-size="20" 
        font-weight="bold" 
        fill="#ffffff" 
        text-anchor="middle"
        filter="url(#glow)">R2S</text>
  
  <!-- Warning symbol overlay -->
  <circle cx="50" cy="30" r="8" fill="#f59e0b" opacity="0.9"/>
  <text x="50" y="35" 
        font-family="Arial, sans-serif" 
        font-size="12" 
        font-weight="bold" 
        fill="#ffffff" 
        text-anchor="middle">!</text>
  
  <!-- Small accent dots -->
  <circle cx="25" cy="25" r="3" fill="#3b82f6" opacity="0.6"/>
  <circle cx="75" cy="25" r="3" fill="#8b5cf6" opacity="0.6"/>
  <circle cx="25" cy="75" r="3" fill="#8b5cf6" opacity="0.6"/>
  <circle cx="75" cy="75" r="3" fill="#3b82f6" opacity="0.6"/>
</svg>

